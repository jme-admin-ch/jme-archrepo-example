description:
  en:
    localisedName: jme-archrepo-example
    shortDescription: Example project demonstrating how to deploy the jEAP Architecture Repository.
    longDescription: >
      The jEAP Architecture Repository (archrepo) is a service for storing and displaying
      architecture documentation of software systems, including database schemas, OpenAPI
      specifications, and system relationships. It is delivered as a jEAP library
      (jeap-archrepo-web) that development teams instantiate per environment.
      This repository provides an example of how to set up and configure the
      Architecture Repository service for local development.
      It contains the following modules:
      * jme-archrepo-service: An instance of the Architecture Repository service
      * jme-archrepo-auth-scs: An instance of the OAuth mock server to access the Architecture Repository
    features:
      - Demonstrates instantiation and configuration of the jEAP Architecture Repository
      - Includes OAuth mock server for authentication
      - Provides Docker Compose setup for local development
