server:
  port: 8081
  servlet:
    context-path: "/default-oauth-mock-server"

mockserver:
  base-url: "http://localhost:${server.port}${server.servlet.context-path}"

oauth-mock-data:
  clients:
    - client-id: "jme-archrepo-it-client"
      client-secret: "{noop}secret"
      context: "SYS"
      userroles:
        - "jme_@database-schema_#write"
        - "jme_@openapidoc_#write"